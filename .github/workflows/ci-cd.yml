```yaml
name: CI/CD - Dashboard App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"

  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lopes19219/dashboard-app

jobs:
  test:
    name: Testes e lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        working-directory: app
        run: |
          flake8 . --max-line-length=100 \
            --extend-ignore=E501,W503 --exit-zero

      - name: Verificar sintaxe
        working-directory: app
        run: |
          python -m py_compile app.py bcb_client.py

  build-and-push:
    name: Build + push da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: lopes19219
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy (Render)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Validar secrets
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || {
            echo "::error::Falta RENDER_DEPLOY_HOOK_URL"
            exit 1
          }
          test -n "$HEALTHCHECK_URL" || {
            echo "::error::Falta APP_HEALTHCHECK_URL"
            exit 1
          }

      - name: Disparar deploy do Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST "$DEPLOY_HOOK"

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent \
              "${HEALTHCHECK_URL%/}/healthz"; then
              echo "Health check concluído."
              exit 0
            fi
            echo "Tentativa $attempt/12..."
            sleep 10
          done

          echo "::error::Health check falhou."
          exit 1
```
